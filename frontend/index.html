    <p class="tagline">Pega el link del video y bájalo sin marca de agua. Un solo lugar para todas las redes.</p>

    <div class="dropzone" id="dropzone">
      <label for="url" class="visually-hidden" style="position:absolute;left:-9999px">Link del video</label>
      <input id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://www.tiktok.com/@alguien/video/…">
      <button class="btn-paste" id="paste" type="button">Pegar</button>
      <button class="btn-go" id="go" type="button" disabled>Descargar</button>
    </div>

    <ul class="platforms idle" id="platforms">
      <li data-p="tiktok" style="--c:#FF2D6F"><span class="dot"></span>TikTok</li>
      <li data-p="instagram" style="--c:#C13584"><span class="dot"></span>Instagram</li>
      <li data-p="twitter" style="--c:#3D5AFE"><span class="dot"></span>X / Twitter</li>
      <li data-p="facebook" style="--c:#1F6FEB"><span class="dot"></span>Facebook</li>
      <li data-p="youtube" style="--c:#E62117"><span class="dot"></span>YouTube</li>
    </ul>

    <p class="hint" id="hint" aria-live="polite"></p>
  </section>

  <div class="loading" id="loading" hidden>
    <div class="spinner"></div>
    <span>Buscando el video…</span>
  </div>

  <article class="result" id="result" hidden>
    <div class="thumb" id="thumb">Vista previa</div>
    <div class="result-body">
      <h2 id="r-title"></h2>
      <p class="meta" id="r-meta"></p>
      <div class="options" id="r-options"></div>
    </div>
  </article>

  <footer>Para uso personal.</footer>

<div class="toast" id="toast" role="status"></div>
