<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>67downloader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  /* ========== Tokens de diseño ========== */
  :root {
    --bg: #F2F0FF;
    --ink: #1B1340;
    --ink-soft: #5B5480;
    --pink: #FF4FA3;
    --cobalt: #3D5AFE;
    --ok: #00A673;
    --error: #D92D4B;
    --surface: #FFFFFF;
    --line: #1B1340;
    --numeral: #E2DCFF;
    --font: "Bricolage Grotesque", "Segoe UI", system-ui, -apple-system, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15102E;
      --ink: #F2F0FF;
      --ink-soft: #A9A2CF;
      --surface: #211A45;
      --line: #F2F0FF;
      --numeral: #241C4E;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15102E;
    --ink: #F2F0FF;
    --ink-soft: #A9A2CF;
    --surface: #211A45;
    --line: #F2F0FF;
    --numeral: #241C4E;
  }

  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 1.0625rem;
    line-height: 1.5;
    overflow-x: hidden;
  }

  main {
    position: relative;
    max-width: 38rem;
    margin: 0 auto;
    padding: 3rem 1.25rem 4rem;
  }

  /* ========== Hero: el 67 gigante ========== */
  .numeral {
    position: absolute;
    top: -1.5rem;
    left: 50%;
    transform: translateX(-50%) rotate(-6deg);
    font-size: clamp(14rem, 55vw, 24rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.06em;
    color: var(--numeral);
    z-index: 0;
    pointer-events: none;
    user-select: none;
  }
  .hero { position: relative; z-index: 1; padding-top: 3.5rem; }
  .hero-top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 0.5rem;
  }

  /* ========== El gato haciendo 67 ========== */
  .cat {
    width: clamp(8rem, 34vw, 11rem);
    height: auto;
    flex-shrink: 0;
    overflow: visible;
  }
  .cat .arm, .cat .head, .cat .tail { transform-box: view-box; }
  .cat .arm-left {
    transform-origin: 74px 140px;
    animation: arm-left 0.7s ease-in-out infinite;
  }
  .cat .arm-right {
    transform-origin: 126px 140px;
    animation: arm-right 0.7s ease-in-out infinite;
  }
  @keyframes arm-left {
    0%, 100% { transform: rotate(16deg); }
    50% { transform: rotate(-10deg); }
  }
  @keyframes arm-right {
    0%, 100% { transform: rotate(10deg); }
    50% { transform: rotate(-16deg); }
  }
  .cat .head {
    transform-origin: 100px 120px;
    animation: head-bob 0.7s ease-in-out infinite;
  }
  @keyframes head-bob {
    0%, 100% { transform: rotate(-4deg); }
    50% { transform: rotate(4deg); }
  }
  .cat .tail {
    transform-origin: 136px 182px;
    animation: tail 1.4s ease-in-out infinite;
  }
  @keyframes tail {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-14deg); }
  }
  .cat .sparkle {
    transform-box: fill-box;
    transform-origin: center;
    animation: twinkle 1.6s ease-in-out infinite;
  }
  .cat .sparkle.s2 { animation-delay: 0.8s; }
  @keyframes twinkle {
    0%, 100% { transform: scale(0.6); opacity: 0.4; }
    50% { transform: scale(1.1); opacity: 1; }
  }
  .cat .num {
    font-family: var(--font);
    font-weight: 800;
    font-size: 17px;
    fill: #fff;
    text-anchor: middle;
  }
  h1 {
    margin: 0;
    font-size: clamp(2.5rem, 9vw, 3.75rem);
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1;
  }
  .tagline {
    margin: 0.75rem 0 2rem;
    color: var(--ink-soft);
    max-width: 30rem;
  }

  /* ========== Caja del link ========== */
  .dropzone {
    position: relative;
    z-index: 1;
    background: var(--surface);
    border: 3px solid var(--line);
    border-radius: 1.25rem;
    box-shadow: 6px 6px 0 var(--pink);
    padding: 0.5rem;
    display: flex;
    gap: 0.5rem;
    transition: box-shadow 0.2s ease;
  }
  .dropzone.has-platform { box-shadow: 6px 6px 0 var(--platform-color, var(--pink)); }
  .dropzone input {
    flex: 1;
    min-width: 0;
    border: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 1.05rem;
    padding: 0.75rem 0.75rem;
    outline: none;
  }
  .dropzone input::placeholder { color: var(--ink-soft); }
  .dropzone:focus-within { outline: 3px solid var(--cobalt); outline-offset: 4px; }

  button {
    font: inherit;
    cursor: pointer;
    border: 0;
  }
  button:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 3px; }

  .btn-paste {
    background: transparent;
    color: var(--ink-soft);
    font-weight: 600;
    padding: 0 0.75rem;
    border-radius: 0.75rem;
  }
  .btn-paste:hover { color: var(--ink); }

  .btn-go {
    background: var(--ink);
    color: var(--bg);
    font-weight: 800;
    padding: 0.75rem 1.25rem;
    border-radius: 0.85rem;
    white-space: nowrap;
  }
  .btn-go:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-go:not(:disabled):active { transform: translateY(1px); }

  /* ========== Plataformas soportadas ========== */
  .platforms {
    position: relative;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1.5rem;
    padding: 0;
    list-style: none;
  }
  .platforms li {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.35rem 0.8rem;
    border: 2px solid var(--line);
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 600;
    opacity: 0.45;
    transition: opacity 0.2s ease, background 0.2s ease, color 0.2s ease;
  }
  .platforms li .dot {
    width: 0.6rem; height: 0.6rem; border-radius: 50%;
    background: var(--c);
  }
  .platforms.idle li { opacity: 1; }
  .platforms li.active {
    opacity: 1;
    background: var(--c);
    border-color: var(--c);
    color: #fff;
  }
  .platforms li.active .dot { background: #fff; }

  .hint {
    position: relative; z-index: 1;
    min-height: 1.5rem;
    margin: 0.75rem 0 0;
    font-size: 0.95rem;
    color: var(--ink-soft);
  }
  .hint.error { color: var(--error); font-weight: 600; }

  /* ========== Resultado ========== */
  .result {
    position: relative; z-index: 1;
    margin-top: 2rem;
    background: var(--surface);
    border: 3px solid var(--line);
    border-radius: 1.25rem;
    overflow: hidden;
  }
  .result[hidden] { display: none; }
  .thumb {
    aspect-ratio: 9 / 16;
    max-height: 22rem;
    width: 100%;
    background:
      repeating-linear-gradient(135deg, transparent 0 14px, rgba(255,255,255,0.12) 14px 28px),
      var(--platform-color, var(--cobalt));
    display: grid;
    place-items: center;
    color: #fff;
    font-weight: 800;
    font-size: 1.1rem;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .result-body { padding: 1.25rem; }
  .result-body h2 {
    margin: 0 0 0.25rem;
    font-size: 1.25rem;
    letter-spacing: -0.01em;
  }
  .meta { margin: 0 0 1.25rem; color: var(--ink-soft); font-size: 0.95rem; }
  .options { display: grid; gap: 0.6rem; }
  .option {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    width: 100%;
    text-align: left;
    padding: 0.9rem 1rem;
    border: 2px solid var(--line);
    border-radius: 0.9rem;
    background: transparent;
    color: var(--ink);
  }
  .option:hover { background: var(--bg); }
  .option.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .option.primary:hover { opacity: 0.9; }
  .option strong { display: block; font-weight: 800; }
  .option span.sub { font-size: 0.875rem; opacity: 0.75; }
  .option .size { font-weight: 600; white-space: nowrap; font-size: 0.9rem; }

  /* ========== Cargando ========== */
  .loading {
    position: relative; z-index: 1;
    margin-top: 2rem;
    display: flex; align-items: center; gap: 0.75rem;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .loading[hidden] { display: none; }
  .spinner {
    width: 1.5rem; height: 1.5rem;
    border: 3px solid var(--numeral);
    border-top-color: var(--pink);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 150%);
    background: var(--ok);
    color: #fff;
    font-weight: 700;
    padding: 0.75rem 1.25rem;
    border-radius: 999px;
    transition: transform 0.3s ease;
    z-index: 10;
    max-width: calc(100% - 2rem);
  }
  .toast.show { transform: translate(-50%, 0); }

  footer {
    position: relative; z-index: 1;
    margin-top: 3rem;
    font-size: 0.875rem;
    color: var(--ink-soft);
  }

  @media (max-width: 30rem) {
    .dropzone { flex-wrap: wrap; }
    .dropzone input { flex-basis: 100%; }
    .btn-paste { flex: 1; padding: 0.6rem; }
    .btn-go { flex: 2; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<script>
/* =========================================================
   1. Detección de plataforma
   Cada plataforma tiene un patrón para reconocer sus links.
   ========================================================= */
const PLATFORMS = {
  tiktok: {
    name: "TikTok",
    color: "#FF2D6F",
    pattern: /(^|\.)tiktok\.com\//i
  },
  instagram: {
    name: "Instagram",
    color: "#C13584",
    pattern: /(^|\.)instagram\.com\/(p|reel|reels|tv)\//i
  },
  twitter: {
    name: "X / Twitter",
    color: "#3D5AFE",
    pattern: /(^|\.)(twitter|x)\.com\/.+\/status\/\d+/i
  },
  facebook: {
    name: "Facebook",
    color: "#1F6FEB",
    pattern: /((^|\.)facebook\.com\/|(^|\.)fb\.watch\/)/i
  },
  youtube: {
    name: "YouTube",
    color: "#E62117",
    // Videos normales, Shorts, directos y links cortos de youtu.be
    pattern: /((^|\.)youtube\.com\/(watch|shorts\/|live\/)|(^|\.)youtu\.be\/)/i
  }
};

function detectPlatform(text) {
  let url;
  try {
    url = new URL(text.trim());
  } catch {
    return null; // No es un link válido todavía
  }
  const target = url.hostname + url.pathname;
  for (const [key, p] of Object.entries(PLATFORMS)) {
    if (p.pattern.test(target)) return key;
  }
  return "unknown";
}

/* =========================================================
   2. Conexión con el backend
   ========================================================= */
async function fetchVideoInfo(url) {
  const res = await fetch("/api/info", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    // El backend manda el mensaje de error en "detail"
    throw new Error(data.detail || "No se pudo obtener el video.");
  }
  return data;
}

function downloadUrl(url, formatId) {
  const params = new URLSearchParams({ url, format: formatId });
  return `/api/download?${params}`;
}

/* =========================================================
   3. Interfaz
   ========================================================= */
const $ = id => document.getElementById(id);
const input = $("url");
const goBtn = $("go");
const hint = $("hint");
const dropzone = $("dropzone");
const chips = $("platforms");
const loading = $("loading");
const result = $("result");

let currentPlatform = null;

function updateDetection() {
  const value = input.value;
  const platform = detectPlatform(value);
  currentPlatform = platform;

  chips.classList.toggle("idle", !value.trim());
  chips.querySelectorAll("li").forEach(li => {
    li.classList.toggle("active", li.dataset.p === platform);
  });

  hint.classList.remove("error");
  if (!value.trim()) {
    hint.textContent = "";
    dropzone.classList.remove("has-platform");
    goBtn.disabled = true;
    return;
  }

  if (platform && platform !== "unknown") {
    const p = PLATFORMS[platform];
    dropzone.style.setProperty("--platform-color", p.color);
    dropzone.classList.add("has-platform");
    hint.textContent = `Link de ${p.name} detectado.`;
    goBtn.disabled = false;
  } else {
    dropzone.classList.remove("has-platform");
    goBtn.disabled = true;
    hint.textContent = platform === "unknown"
      ? "Ese link no es de TikTok, Instagram, X, Facebook o YouTube."
      : "Pega el link completo, empezando con https://";
    if (platform === "unknown") hint.classList.add("error");
  }
}

async function handleDownload() {
  if (!currentPlatform || currentPlatform === "unknown") return;
  result.hidden = true;
  loading.hidden = false;
  goBtn.disabled = true;

  try {
    const info = await fetchVideoInfo(input.value.trim());
    renderResult(info);
  } catch (err) {
    hint.textContent = err.message || "No se pudo obtener el video. Revisa que el link sea público e inténtalo otra vez.";
    hint.classList.add("error");
  } finally {
    loading.hidden = true;
    goBtn.disabled = false;
  }
}

function renderResult(info) {
  const p = PLATFORMS[info.platform];
  result.style.setProperty("--platform-color", p.color);
  const thumb = $("thumb");
  thumb.textContent = p.name;
  if (info.thumbnail) {
    const img = document.createElement("img");
    img.src = info.thumbnail;
    img.alt = "";
    img.referrerPolicy = "no-referrer";
    // Si la red bloquea la miniatura, se queda el bloque de color
    img.onload = () => { thumb.textContent = ""; thumb.appendChild(img); };
  }
  $("r-title").textContent = info.title;
  $("r-meta").textContent = [info.author, info.duration].filter(Boolean).join(", ");

  const options = $("r-options");
  options.innerHTML = "";
  info.formats.forEach(f => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "option" + (f.primary ? " primary" : "");
    btn.innerHTML = `<span><strong>${f.label}</strong><span class="sub">${f.sub}</span></span><span class="size">↓</span>`;
    btn.addEventListener("click", () => {
      // Un link normal hace que el navegador baje el archivo solito
      const a = document.createElement("a");
      a.href = downloadUrl(input.value.trim(), f.id);
      a.download = "";
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast(`Preparando ${f.label.toLowerCase()}… puede tardar unos segundos`);
    });
    options.appendChild(btn);
  });

  result.hidden = false;
  result.scrollIntoView({ behavior: "smooth", block: "start" });
}

let toastTimer;
function showToast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

input.addEventListener("input", updateDetection);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !goBtn.disabled) handleDownload();
});
goBtn.addEventListener("click", handleDownload);

$("paste").addEventListener("click", async () => {
  try {
    const text = await navigator.clipboard.readText();
    input.value = text;
    updateDetection();
    input.focus();
  } catch {
    hint.textContent = "Tu navegador no dejó leer el portapapeles. Pega el link con Ctrl+V.";
    hint.classList.add("error");
    input.focus();
  }
});
</script>
